version: '3.8'

services:
  employee-service:
    build: .
    container_name: employee-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=employee-db
      - DB_USER=employee_user
      - DB_PASSWORD=employee_password
      - DB_NAME=employee_db
      - JWT_SECRET=your-secret-key-change-in-production
    depends_on:
      employee-db:
        condition: service_healthy
    networks:
      - employee-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  employee-db:
    image: mysql:8.0
    container_name: employee-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=employee_db
      - MYSQL_USER=employee_user
      - MYSQL_PASSWORD=employee_password
    ports:
      - "3306:3306"
    volumes:
      - employee-db-data:/var/lib/mysql
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - employee-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "employee_user", "-pemployee_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  employee-db-data:
    name: employee-db-data

networks:
  employee-network:
    name: employee-network
    driver: bridge